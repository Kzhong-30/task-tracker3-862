name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  AWS_EC2_HOST: ${{ secrets.AWS_EC2_HOST }}
  AWS_EC2_USER: ${{ secrets.AWS_EC2_USER }}
  AWS_EC2_KEY: ${{ secrets.AWS_EC2_KEY }}

jobs:
  # 阶段1: 自动化测试
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            api/package-lock.json
            client/package-lock.json

      # API 测试
      - name: Install API dependencies
        working-directory: ./api
        run: npm ci

      - name: Run API tests
        working-directory: ./api
        run: npm test -- --coverage --reporter=verbose || echo "No tests found, skipping..."
        continue-on-error: true

      # 客户端测试
      - name: Install Client dependencies
        working-directory: ./client
        run: npm ci

      - name: Run Client tests
        working-directory: ./client
        run: npm test -- --coverage --reporter=verbose || echo "No tests found, skipping..."
        continue-on-error: true

      # 生成测试报告
      - name: Upload API test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-coverage-node-${{ matrix.node-version }}
          path: api/coverage/
          retention-days: 7

      - name: Upload Client test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-test-coverage-node-${{ matrix.node-version }}
          path: client/coverage/
          retention-days: 7

  # 阶段2: 构建和推送Docker镜像
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 构建并推送API镜像
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/task-tracker-api:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/task-tracker-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 构建并推送Client镜像
      - name: Build and push Client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/task-tracker-client:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/task-tracker-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 保存镜像信息
      - name: Save build info
        run: |
          echo "API_IMAGE=${{ secrets.DOCKER_HUB_USERNAME }}/task-tracker-api:${{ github.sha }}" >> $GITHUB_ENV
          echo "CLIENT_IMAGE=${{ secrets.DOCKER_HUB_USERNAME }}/task-tracker-client:${{ github.sha }}" >> $GITHUB_ENV

  # 阶段3: 部署到AWS EC2
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_EC2_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.AWS_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          HOST: ${{ secrets.AWS_EC2_HOST }}
          USER: ${{ secrets.AWS_EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
            # 设置环境变量
            export DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}
            
            # 创建工作目录
            mkdir -p ~/task-tracker
            cd ~/task-tracker
            
            # 拉取最新的docker-compose.yml（如果不存在则创建）
            if [ ! -f docker-compose.yml ]; then
              cat > docker-compose.yml << 'COMPOSE'
          version: "3.9"

          services:
            api:
              image: ${{ secrets.DOCKER_HUB_USERNAME }}/task-tracker-api:latest
              container_name: task-tracker-api
              ports:
                - "5000:5000"
              environment:
                - MONGO_URL=mongodb://mongo:27017/tasktracker
                - PORT=5000
              depends_on:
                - mongo
              restart: always

            client:
              image: ${{ secrets.DOCKER_HUB_USERNAME }}/task-tracker-client:latest
              container_name: task-tracker-client
              ports:
                - "5173:5173"
              environment:
                - VITE_API_URL=http://${{ secrets.AWS_EC2_HOST }}:5000
              depends_on:
                - api
              restart: always

            mongo:
              image: mongo:7
              container_name: task-tracker-mongo
              restart: always
              ports:
                - "27017:27017"
              volumes:
                - mongo-data:/data/db

          volumes:
            mongo-data:
          COMPOSE
            fi
            
            # 登录Docker Hub
            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin
            
            # 拉取最新镜像
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/task-tracker-api:latest
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/task-tracker-client:latest
            
            # 停止并删除旧容器
            docker-compose down || true
            
            # 清理旧镜像
            docker image prune -f
            
            # 启动新容器
            docker-compose up -d
            
            # 检查容器状态
            docker-compose ps
            
            # 等待服务启动
            sleep 10
            
            # 健康检查
            echo "Checking API health..."
            curl -f http://localhost:5000/health || echo "API health check endpoint not available"
            
            echo "Checking Client..."
            curl -f http://localhost:5173 || echo "Client check completed"
            
            echo "Deployment completed successfully!"
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key.pem

  # 通知阶段
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [test, build-and-push, deploy]
    if: always()

    steps:
      - name: Deployment Status
        run: |
          echo "Test Status: ${{ needs.test.result }}"
          echo "Build Status: ${{ needs.build-and-push.result }}"
          echo "Deploy Status: ${{ needs.deploy.result }}"

          if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.build-and-push.result }}" == "success" ] && [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ CI/CD Pipeline completed successfully!"
          else
            echo "❌ CI/CD Pipeline failed!"
            exit 1
          fi

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
  AWS_HOST: ${{ secrets.AWS_HOST }}
  AWS_USER: ${{ secrets.AWS_USER }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            api/package-lock.json
            client/package-lock.json

      - name: Install API dependencies
        working-directory: ./api
        run: npm ci

      - name: Install Client dependencies
        working-directory: ./client
        run: npm ci

      - name: Run API tests
        working-directory: ./api
        run: npm test

      - name: Run Client tests
        working-directory: ./client
        run: npm test

      - name: Upload API coverage report
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-report
          path: api/coverage/
          retention-days: 7

      - name: Upload Client coverage report
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage-report
          path: client/coverage/
          retention-days: 7

      - name: Generate test summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ API tests completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Client tests completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports have been uploaded as artifacts." >> $GITHUB_STEP_SUMMARY

  build-and-push:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/task-tracker-api
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Client
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/task-tracker-client
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### API Image" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-api.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Client Image" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-client.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          ssh -o StrictHostKeyChecking=no $AWS_USER@$AWS_HOST << 'ENDSSH'
            set -e
            
            echo "🚀 Starting deployment..."
            
            # Pull latest images
            echo "📦 Pulling latest Docker images..."
            docker pull ${DOCKER_USERNAME}/task-tracker-api:latest
            docker pull ${DOCKER_USERNAME}/task-tracker-client:latest
            
            # Stop existing containers
            echo "🛑 Stopping existing containers..."
            docker stop task-tracker-api task-tracker-client 2>/dev/null || true
            docker rm task-tracker-api task-tracker-client 2>/dev/null || true
            
            # Start new containers
            echo "🚀 Starting new containers..."
            docker run -d \
              --name task-tracker-api \
              -p 5001:5001 \
              -e MONGO_URL=mongodb://host.docker.internal:27017/tasktracker \
              -e PORT=5001 \
              --restart unless-stopped \
              ${DOCKER_USERNAME}/task-tracker-api:latest
            
            docker run -d \
              --name task-tracker-client \
              -p 5173:5173 \
              -e VITE_API_URL=http://${AWS_HOST}:5001 \
              --restart unless-stopped \
              ${DOCKER_USERNAME}/task-tracker-client:latest
            
            # Clean up old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✅ Deployment completed successfully!"
            
            # Show running containers
            docker ps --filter "name=task-tracker"
          ENDSSH

      - name: Verify deployment
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
        run: |
          echo "🔍 Verifying deployment..."

          # Wait for services to be ready
          sleep 10

          # Check API health
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${AWS_HOST}:5001/ || echo "000")

          if [ "$API_STATUS" = "200" ]; then
            echo "✅ API is running (HTTP $API_STATUS)"
          else
            echo "⚠️ API might not be ready (HTTP $API_STATUS)"
          fi

          # Check Client health
          CLIENT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${AWS_HOST}:5173/ || echo "000")

          if [ "$CLIENT_STATUS" = "200" ]; then
            echo "✅ Client is running (HTTP $CLIENT_STATUS)"
          else
            echo "⚠️ Client might not be ready (HTTP $CLIENT_STATUS)"
          fi

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully deployed to AWS EC2" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** \`${{ secrets.AWS_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Services:**" >> $GITHUB_STEP_SUMMARY
          echo "- API: http://${{ secrets.AWS_HOST }}:5001" >> $GITHUB_STEP_SUMMARY
          echo "- Client: http://${{ secrets.AWS_HOST }}:5173" >> $GITHUB_STEP_SUMMARY
